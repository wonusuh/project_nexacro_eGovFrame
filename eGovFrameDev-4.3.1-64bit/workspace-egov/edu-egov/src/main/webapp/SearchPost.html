<script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script>
    // window.NEXACROHTML 객체 초기화
    if (!window.NEXACROHTML) {
        window.NEXACROHTML = {};
    }

    function sample6_execDaumPostcode(param) {
        new kakao.Postcode({
            oncomplete: function (data) {
                // 팝업에서 검색결과 항목을 클릭했을때 실행할 코드를 작성하는 부분.

                // 각 주소의 노출 규칙에 따라 주소를 조합한다.
                // 내려오는 변수가 값이 없는 경우엔 공백('')값을 가지므로, 이를 참고하여 분기 한다.
                var addr = ""; // 주소 변수
                var extraAddr = ""; // 참고항목 변수

                //사용자가 선택한 주소 타입에 따라 해당 주소 값을 가져온다.
                if (data.userSelectedType === "R") {
                    // 사용자가 도로명 주소를 선택했을 경우
                    addr = data.roadAddress;
                } else {
                    // 사용자가 지번 주소를 선택했을 경우(J)
                    addr = data.jibunAddress;
                }

                // 사용자가 선택한 주소가 도로명 타입일때 참고항목을 조합한다.
                if (data.userSelectedType === "R") {
                    // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                    // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                    if (
                        data.bname !== "" &&
                        /[동로가]$/.test(data.bname)
                    ) {
                        extraAddr += data.bname;
                    }
                    // 건물명이 있고, 공동주택일 경우 추가한다.
                    if (
                        data.buildingName !== "" &&
                        data.apartment === "Y"
                    ) {
                        extraAddr +=
                            extraAddr !== ""
                                ? ", " + data.buildingName
                                : data.buildingName;
                    }
                    // 표시할 참고항목이 있을 경우, 괄호까지 추가한 최종 문자열을 만든다.
                    if (extraAddr !== "") {
                        extraAddr = " (" + extraAddr + ")";
                    }
                }

                const jusoInfo =
                    data.zonecode + "||" + addr + "||" + extraAddr;
                callNexacro(jusoInfo);
            }
        }).open({ q: param });
    }

    // WebBrowser onusernotify 이벤트 발생시킴
    const callNexacro = (userData) => {
        window.NEXACROHTML.FireUserNotify(userData);
    };

    // onusernotify 이벤트 정의
    window.NEXACROHTML.FireUserNotify = (userData) => {
        const NXWB = window.NEXACROWEBBROWSER;

        // 실행환경에 따라서 분기
        if (NXWB) {
            // WRE, NRE(iOS/iPadOS)
            NXWB.on_fire_onusernotify(NXWB, userData);
        } else if (typeof nexacro === "undefined") {
            // NRE(Windows)
            window.document.title = userData;
        } else if (nexacro) {
            // NRE(Android, macOS)
            nexacro.fireUserNotify(userData);
        }
    };
</script>
